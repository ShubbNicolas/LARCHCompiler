name: CI

on:
  push:
    branches: [master, rework-dev]
  pull_request:
    branches: [master, rework-dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # UiSmokeTest 需要图形环境；无显示时会自动跳过，这里用 Xvfb 让 13 个 UI 测试真正执行
      - name: Install Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Run tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" ./mvnw -B -ntp verify

      - name: Summarize test results
        if: always()
        env:
          JDK_VERSION: ${{ matrix.java }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          total = failures = errors = skipped = 0
          for report in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              attrs = ET.parse(report).getroot().attrib
              total += int(attrs.get('tests', 0))
              failures += int(attrs.get('failures', 0))
              errors += int(attrs.get('errors', 0))
              skipped += int(attrs.get('skipped', 0))

          jdk = os.environ.get('JDK_VERSION', '?')
          print(f'Tests run: {total}, Failures: {failures}, Errors: {errors}, Skipped: {skipped}')
          print(f'::notice title=Surefire (JDK {jdk})::'
                f'{total} tests, {failures} failures, {errors} errors, {skipped} skipped')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('| JDK | Tests | Failures | Errors | Skipped |\n')
              summary.write('|---|---:|---:|---:|---:|\n')
              summary.write(f'| {jdk} | {total} | {failures} | {errors} | {skipped} |\n')

          if total == 0:
              raise SystemExit('no surefire reports found')
          if failures or errors:
              raise SystemExit(f'{failures} failures, {errors} errors')
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore
