name: CI

on:
  push:
    branches: [master, rework-dev]
  pull_request:
    branches: [master, rework-dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # UiSmokeTest 需要图形环境；无显示时会自动跳过，这里用 Xvfb 让 13 个 UI 测试真正执行
      - name: Install Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Run tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore
